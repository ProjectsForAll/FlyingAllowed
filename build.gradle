plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1' // for shadowing
    id "io.freefair.lombok" version "9.5.0"
}

apply from: rootDir.toString() + '/dependencies.gradle'

group = properties['group']
version = properties['version']

// Build output lands in target/ rather than Gradle's default build/.
layout.buildDirectory = file("target")

java.sourceCompatibility = JavaVersion.VERSION_11
java.targetCompatibility = JavaVersion.VERSION_11

// Lombok reaches into javac internals, so the version must know about the JDK
// compiling the build. The plugin's bundled default lags current JDKs; pinning
// keeps the annotation processor ahead of the toolchain in use.
lombok {
    version = '1.18.48'
}

ext {
    pluginMain = properties['plugin.main'] == 'default' ?
            "${project.group}.${project.name.toLowerCase()}.${project.name}" :
            properties['plugin.main']
}

repositories {
    mavenCentral()
    maven {
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'

        // As of Gradle 5.1, you can limit this to only those
        // dependencies you expect from it
        content {
            includeGroup 'org.bukkit'
            includeGroup 'org.spigotmc'
        }
    }
    maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url = 'https://oss.sonatype.org/content/repositories/central' }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    // Streamline Essentials CodeMC Repo
    maven { url "https://repo.codemc.io/repository/streamline-essentials/" }
    // CodeMC NMS Repo
    maven { url "https://repo.codemc.io/repository/nms/" }
    // JitPack
    maven { url "https://jitpack.io" }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
    maven { url 'https://repo.papermc.io/repository/maven-snapshots/' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.onarandombox.com/content/groups/public/' }
    maven { url 'https://repo.bg-software.com/repository/nms/' }
    maven { url 'https://repo.bg-software.com/repository/api/' }

    // Husk Claims
    maven { url 'https://repo.william278.net/releases' }

    // WorldGuard
    maven { url 'https://maven.enginehub.org/repo/' }

    // GriefDefender
    maven {
        name = 'griefdefender'
        url = 'https://repo.glaremasters.me/repository/bloodshot'
    }

    // Improved Factions (only published on Modrinth)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Several of the soft-depend plugin APIs ship with a higher bytecode target
// than this plugin's Java 11 output; without this, resolution rejects them for
// being incompatible with the target JVM even though they are compile-only.
java.disableAutoTargetJvm()

dependencies {
    // Defaults.
    compileOnly(files(FILES))
    annotationProcessor(ANNO)
    implementation(IMPL)
    compileOnly(COMP_ONLY)
    shadow(SHADOW)

    // Other Plugins
    compileOnly(OTHER_PLUGINS)

    // FAWE
    implementation(platform("com.intellectualsites.bom:bom-newest:1.52")) // Ref: https://github.com/IntellectualSites/bom
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Core")
    compileOnly("com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit").transitive = false
}

processResources {
    // Debugging: Print values
    doFirst {
        println "Version: ${project.version}, Name: ${project.name}, Main: ${project.ext.pluginMain}"
    }

    inputs.property('name', "${project.name}")
    inputs.property('version', "${project.version}")
    inputs.property('main', "${project.ext.pluginMain}")

    filesMatching('**/plugin.yml') {
        expand (
                'name': "${project.name}",
                'version': "${project.version}",
                'main': "${project.ext.pluginMain}",
        )
    }
}

shadowJar {
    archiveClassifier.set('')

    archiveFileName = "${project.name}-${project.version}.jar"

    minimize()
}

// The plugin jar is the shaded one, so `build` must produce it.
assemble.dependsOn shadowJar

wrapper {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.ALL
}